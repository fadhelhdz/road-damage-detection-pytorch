# Baseline RetinaNet config.
data:
  dataset_root: ./data/rdd
  image_size: 800
  batch_size: 2
  num_workers: 4

model:
  name: retinanet
  num_classes: 5   # 4 damage classes + background (0); labels are 1-indexed
  pretrained: true

train:
  epochs: 12
  lr: 0.01
  weight_decay: 0.0001
  optimizer: sgd
  seed: 42
  amp: true