[project]
name = "road-damage-detection-pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[project.optional-dependencies]
cpu    = ["torch==2.12.1", "torchvision==0.27.1"]
cu132  = ["torch==2.12.1", "torchvision==0.27.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
torch       = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu132", extra = "cu132" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu132", extra = "cu132" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
